name: music-discovery

x-app: &app
  build: .
  image: music-discovery-app   # one image shared by web, worker and beat
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.prod
  depends_on:
    db:
      condition: service_healthy
    redis:
      condition: service_healthy
  restart: unless-stopped

services:
  db:
    image: postgres:16-alpine
    environment:  # only what Postgres needs; keep Django/Spotify secrets out of this container
      POSTGRES_DB: "${POSTGRES_DB:-musicdb}"
      POSTGRES_USER: "${POSTGRES_USER:-music}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD:-music}"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  web:
    <<: *app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.prod
      RUN_MIGRATIONS: "1"
    volumes:
      - static:/app/staticfiles
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health/"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 20s

  worker:
    <<: *app
    command: ["celery", "-A", "config", "worker", "-l", "info", "--concurrency=2"]
    depends_on:
      web:
        condition: service_healthy

  beat:
    <<: *app
    command: ["celery", "-A", "config", "beat", "-l", "info", "--schedule", "/tmp/celerybeat-schedule"]
    depends_on:
      web:
        condition: service_healthy

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${NGINX_PORT:-80}:80"
    environment:
      NGINX_ENVSUBST_FILTER: "^NGINX_"
      NGINX_RATE_LIMIT: "${NGINX_RATE_LIMIT:-30}"
      NGINX_RATE_BURST: "${NGINX_RATE_BURST:-50}"
    volumes:
      - ./docker/nginx/default.conf.template:/etc/nginx/templates/default.conf.template:ro
      - ./docker/nginx/proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - static:/app/staticfiles:ro
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  static:
