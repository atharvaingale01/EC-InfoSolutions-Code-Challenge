# Shared upstream headers. X-Forwarded-For is *replaced* with the real client
# address (not appended), so a client cannot smuggle a spoofed value through to
# Django's throttling. nginx is the only trusted hop (REST_FRAMEWORK NUM_PROXIES=1).
proxy_http_version 1.1;
proxy_set_header Host              $http_host;
proxy_set_header X-Real-IP         $remote_addr;
proxy_set_header X-Forwarded-For   $remote_addr;
proxy_set_header X-Forwarded-Proto $scheme;
proxy_set_header X-Request-ID      $request_id;   # correlation id, echoed by Django and logged in the worker
proxy_read_timeout 65s;
proxy_connect_timeout 5s;
