# Development override. Layer it on top of the base file:
#
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml up --build
#   make dev            (other targets: DEV=1 make seed / test / shell ...)
#
# Differences from the base stack:
#   * source tree bind-mounted, Django runserver with autoreload
#   * containers run as your host uid/gid so files they create are yours
#   * DEBUG on, dev settings, browsable API
#   * Postgres / Redis / Django published on the host (15432 / 16379 / 8000)
#   * nginx is not started (Django is reached directly on :8000)
#   * separate project name and volumes, so it can run next to the prod stack

name: music-discovery-dev

x-dev: &dev
  # Match the host user so bind-mounted files stay writable and owned by you.
  # `make dev` exports UID/GID; the defaults suit most single-user Linux setups.
  user: "${UID:-1000}:${GID:-1000}"
  volumes:
    - .:/app
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.dev
    DJANGO_DEBUG: "1"
    HOME: /tmp

services:
  db:
    ports:
      - "${DEV_DB_PORT:-15432}:5432"

  redis:
    ports:
      - "${DEV_REDIS_PORT:-16379}:6379"

  web:
    <<: *dev
    command: ["python", "manage.py", "runserver", "0.0.0.0:8000"]
    # Replace (not merge) the base volumes: without the named static volume no
    # root-owned mount point gets created inside the bind-mounted source tree.
    volumes: !override
      - .:/app
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      DJANGO_DEBUG: "1"
      HOME: /tmp
      RUN_MIGRATIONS: "1"
      RUN_COLLECTSTATIC: "0"   # runserver serves static files itself with DEBUG on
    ports:
      - "${DEV_WEB_PORT:-8000}:8000"

  worker:
    <<: *dev
    command: ["celery", "-A", "config", "worker", "-l", "debug", "--concurrency=1"]

  beat:
    <<: *dev

  nginx:
    # Not needed in dev; assigning a profile keeps it from starting by default.
    profiles: ["edge"]
